# =====================================================================
#  Configuración del bot de ofertas de eBay (NextBit Core)
#  Puedes editar este archivo directo en GitHub (ícono del lápiz ✏️).
# =====================================================================

# Lo que cobra tu casillero por producto pequeño (RAM, procesador, M.2, relojes...)
casillero_producto_pequeno: 9

# ZIP de tu casillero en Florida (para que eBay calcule el envío hasta allá)
zip_casillero: "33166"

subastas:
  # Avisar de subastas que terminan dentro de estos minutos
  minutos_antes_de_terminar: 75
  # No avisar si ya falta menos que esto (no alcanzarías a entrar)
  minutos_minimos_restantes: 5
  # Avisar solo si la puja actual + envío está al menos este % por debajo del promedio
  # 0.25 = 25% más barato que el promedio
  descuento_minimo: 0.25

comprar_ahora:
  # Solo publicaciones nuevas (de las últimas X horas)
  horas_publicacion_nueva: 24
  # Avisar solo si precio + envío está al menos este % por debajo del promedio
  descuento_minimo: 0.30

vendedor:
  calificacion_minima: 97   # % de calificación positiva
  ventas_minimas: 10        # cantidad mínima de calificaciones

# Cada cuántas horas recalcular el precio promedio de cada búsqueda
horas_cache_promedio: 12
# Publicaciones mínimas para calcular un promedio confiable
muestras_minimas_promedio: 8

# Límites por ejecución (eBay da 5,000 llamadas gratis al día)
max_llamadas_por_ejecucion: 70
max_avisos_por_ejecucion: 15

# Si el título tiene alguna de estas palabras, se descarta siempre
excluir_siempre:
  - for parts
  - parts only
  - not working
  - broken
  - as is
  - as-is
  - untested
  - damaged
  - cracked
  - icloud
  - locked
  - blacklist
  - bad esn
  - box only
  - empty box
  - replica
  - read description

# =====================================================================
#  BÚSQUEDAS
#  nombre:    cómo aparece en los registros
#  consulta:  lo que se escribe en el buscador de eBay
#  categoria: número de categoría de eBay (ayuda a no mezclar cosas)
#  pequeno:   true = se suma el casillero de $9 / false = "cotizar"
#  requiere:  palabras que SÍ deben estar en el título (opcional)
#  excluir:   palabras que NO deben estar en el título (opcional)
#  precio_maximo: opcional, en USD
#
#  Cada búsqueda gasta ~145 llamadas al día. Con 5,000 gratis,
#  puedes tener hasta ~30 búsquedas.
# =====================================================================
busquedas:
  # ---------- RAM (categoría 170083) ----------
  - nombre: DDR4 16GB 3200
    consulta: DDR4 16GB 2x8GB 3200 desktop
    categoria: 170083
    pequeno: true
    requiere: ["16gb", "3200"]
    excluir: [sodimm, laptop, ecc, server, rdimm, "32gb", "64gb"]

  - nombre: DDR4 16GB 3600
    consulta: DDR4 16GB 2x8GB 3600 desktop
    categoria: 170083
    pequeno: true
    requiere: ["16gb", "3600"]
    excluir: [sodimm, laptop, ecc, server, rdimm, "32gb", "64gb"]

  - nombre: DDR4 32GB 3200
    consulta: DDR4 32GB 2x16GB 3200 desktop
    categoria: 170083
    pequeno: true
    requiere: ["32gb", "3200"]
    excluir: [sodimm, laptop, ecc, server, rdimm, "64gb", "128gb"]

  - nombre: DDR4 32GB 3600
    consulta: DDR4 32GB 2x16GB 3600 desktop
    categoria: 170083
    pequeno: true
    requiere: ["32gb", "3600"]
    excluir: [sodimm, laptop, ecc, server, rdimm, "64gb", "128gb"]

  - nombre: DDR5 32GB 6000
